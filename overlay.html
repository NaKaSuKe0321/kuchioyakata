<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="ngrok-skip-browser-warning" content="true">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width:1920px; height:1080px;
      background:transparent;
      overflow:hidden;
      font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    }
    #app { position:fixed; inset:0; }

    .effect-wrap {
      position:fixed;
      transform:translate(-50%,-50%);
      z-index:100;
      animation:effectIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    .effect-wrap.out { animation:effectOut 0.7s ease forwards; }

    @keyframes effectIn {
      from { transform:translate(-50%,-50%) scale(0.4) rotate(-8deg); opacity:0; }
      to   { transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; }
    }
    @keyframes effectOut {
      from { opacity:1; }
      to   { opacity:0; transform:translate(-50%,-50%) scale(0.9); }
    }
    @keyframes rainbowShift { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    @keyframes iconPulse { 0%{transform:scale(1)} 100%{transform:scale(1.12)} }
    @keyframes textGlow  { 0%{text-shadow:0 0 20px currentColor} 100%{text-shadow:0 0 40px currentColor,0 0 80px currentColor} }
    @keyframes ringPulse { 0%,100%{box-shadow:0 0 40px rgba(255,200,0,0.8)} 50%{box-shadow:0 0 60px rgba(255,220,0,1)} }

    /* ── 占いカード ── */
    .fortune-card { width:280px; background:#0a0014; border-radius:18px; overflow:hidden; }
    .fortune-header { padding:14px 16px; text-align:center; position:relative; }
    .fortune-header-shine { position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.2),transparent); }
    .fortune-emoji { font-size:42px; display:block; }
    .fortune-luck  { font-size:30px; font-weight:900; color:#fff; letter-spacing:2px; }
    .fortune-body  { padding:12px; }
    .fortune-row   { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; margin-bottom:5px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); }
    .fortune-row-icon  { font-size:16px; }
    .fortune-row-label { color:#888; font-size:10px; width:72px; }
    .fortune-row-value { font-weight:bold; font-size:12px; flex:1; color:#fff; }
    .fortune-msg { margin-top:6px; padding:10px 12px; border-radius:10px; color:#fff; font-size:11px; text-align:center; }
    .countdown   { text-align:center; margin-top:8px; color:rgba(255,255,255,0.35); font-size:11px; }
    .super-rare-banner {
      position:absolute; top:-16px; left:50%; transform:translateX(-50%);
      background:linear-gradient(90deg,#ff0080,#ff6600,#ffff00,#00ff00,#ff0080);
      background-size:200% 100%; animation:rainbowShift 1s linear infinite;
      border-radius:99px; padding:3px 16px; color:#000; font-weight:900; font-size:12px; white-space:nowrap; z-index:10;
    }

    /* ── クイズカード ── */
    .quiz-wrap   { display:flex; align-items:flex-start; }
    .quiz-card   { width:270px; }
    .quiz-header { background:linear-gradient(135deg,#00c9ff,#92fe9d); border-radius:14px 14px 0 0; padding:8px 14px; display:flex; align-items:center; gap:8px; }
    .quiz-header-icon { font-size:20px; }
    .quiz-header-text { font-size:16px; font-weight:900; color:#000; }
    .quiz-body   { background:rgba(0,10,30,0.95); border:2px solid rgba(0,200,255,0.3); border-top:none; padding:13px; }
    .quiz-question { color:#fff; font-size:14px; font-weight:bold; line-height:1.5; margin-bottom:11px; }
    .quiz-choices { display:flex; gap:7px; margin-bottom:10px; }
    .quiz-choice { flex:1; padding:8px 5px; border-radius:9px; text-align:center; color:#fff; font-size:11px; }
    .choice-a { background:rgba(255,80,80,0.2); border:1px solid rgba(255,80,80,0.4); }
    .choice-b { background:rgba(80,100,255,0.2); border:1px solid rgba(80,100,255,0.4); }
    .quiz-choice-icon { font-size:18px; margin-bottom:3px; }
    .quiz-free  { background:rgba(80,255,150,0.08); border-radius:9px; padding:9px; color:#80ffbb; font-size:11px; text-align:center; margin-bottom:10px; border:1px solid rgba(80,255,150,0.2); }
    .quiz-hint  { color:#888; font-size:9px; margin-bottom:8px; text-align:center; }
    .timer-wrap { position:relative; height:10px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; }
    .timer-bar  { height:100%; border-radius:99px; transition:width 1s linear,background 0.3s; }
    .timer-num  { text-align:center; font-size:26px; font-weight:900; margin-top:3px; }
    .quiz-footer{ background:rgba(0,10,30,0.95); border-radius:0 0 14px 14px; height:10px; border:2px solid rgba(0,200,255,0.3); border-top:none; }

    /* ── 正解カード ── */
    .answer-card { width:270px; background:linear-gradient(135deg,#0a2a0a,#001a2a); border:2px solid rgba(80,255,150,0.5); border-radius:18px; padding:20px 18px; text-align:center; box-shadow:0 0 60px rgba(80,255,150,0.35); }
    .answer-label { font-size:13px; color:#80ffbb; font-weight:bold; margin-bottom:5px; letter-spacing:2px; }
    .answer-text  { font-size:28px; font-weight:900; color:#44ff88; padding:10px 0; letter-spacing:2px; animation:textGlow 0.8s ease infinite alternate; }
    .answer-expl  { color:#888; font-size:10px; margin-bottom:11px; }
    .answer-challenge { background:rgba(80,255,150,0.08); border-radius:11px; padding:9px 14px; border:1px solid rgba(80,255,150,0.2); color:#80ffbb; font-weight:bold; font-size:12px; }

    /* ── チャット ── */
    .chat-stream { display:flex; flex-direction:column; justify-content:flex-end; gap:3px; width:130px; padding:5px; align-self:flex-end; }
    .chat-msg { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.08); border-radius:7px; padding:3px 7px; color:#ccc; font-size:9px; }
    .chat-msg.correct { background:rgba(80,255,150,0.25); border-color:rgba(80,255,150,0.5); color:#80ffbb; font-weight:bold; }
    .chat-name { color:#888; margin-right:3px; }
    .chat-name.correct { color:#44ff88; }

    /* ── ナイギフ ── */
    .naigif-wrap  { position:relative; border-radius:14px; padding:4px; animation:ringPulse 1.5s ease infinite; }
    .naigif-img   { display:block; width:210px; border-radius:10px; object-fit:cover; }
    .naigif-badge { position:absolute; bottom:-12px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg,#ff6600,#ffcc00); border-radius:99px; padding:3px 16px; color:#000; font-weight:900; font-size:13px; white-space:nowrap; }

    /* ── 音声演出 ── */
    .audio-card { background:rgba(0,0,0,0.85); border-radius:16px; padding:16px 28px; text-align:center; min-width:180px; }
    .audio-icon  { font-size:46px; margin-bottom:8px; animation:iconPulse 0.8s ease infinite alternate; }
    .audio-label { font-weight:900; font-size:16px; letter-spacing:1px; color:#fff; }
    .audio-sub   { font-size:10px; margin-top:6px; }

/* ── 業務警報テロップ ── */
.keikoku-wrap {
  width: 600px;
  border: 4px solid #ff4444;
  border-radius: 16px;
  background: rgba(0,0,0,0.92);
  overflow: hidden;
}
.keikoku-title {
  background: #ff2222;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  padding: 10px;
  letter-spacing: 4px;
}
.keikoku-rarity {
  font-size: 12px;
  text-align: center;
  padding: 6px;
  font-weight: bold;
  letter-spacing: 2px;
}
.keikoku-body {
  color: #fff;
  font-size: 32px;
  font-weight: 900;
  text-align: center;
  padding: 24px 16px;
  letter-spacing: 1px;
}
@keyframes keikokuPulse {
  from { box-shadow: 0 0 20px rgba(255,50,50,0.5); }
  to   { box-shadow: 0 0 60px rgba(255,50,50,1); }
}

/* ── 大喜利（パターンC）── */
.ogiri-wrap {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translate(-50%,-50%);
  z-index: 90;
  width: 760px;
  display: none;
  animation: effectIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
.ogiri-board {
  background: rgba(10,5,0,0.92);
  border: 4px solid #d4af37;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 50px rgba(212,175,55,0.5);
}
.ogiri-title {
  background: linear-gradient(135deg,#d4af37,#f5d76e,#d4af37);
  color: #221a00;
  font-size: 20px;
  font-weight: 900;
  text-align: center;
  padding: 8px;
  letter-spacing: 8px;
}
.ogiri-text {
  color: #fff;
  font-size: 30px;
  font-weight: 900;
  text-align: center;
  padding: 26px 30px;
  line-height: 1.5;
}
.ogiri-timer { text-align: center; padding: 0 0 16px; display: none; }
.ogiri-timer-num { font-size: 46px; font-weight: 900; color: #f5d76e; }
.ogiri-timer-label { font-size: 12px; color: #aa9955; letter-spacing: 3px; }
.ogiri-scoring { text-align: center; padding: 0 0 16px; display: none; }
.ogiri-scoring-label { font-size: 15px; font-weight: 900; color: #ff8fc7; letter-spacing: 2px; margin-bottom: 6px; }
.ogiri-score-num { font-size: 44px; font-weight: 900; color: #ff8fc7; text-shadow: 0 0 20px rgba(255,143,199,0.6); }
.ogiri-scoring-cd { font-size: 12px; color: #aa9955; margin-top: 4px; }
.ogiri-result { text-align: center; padding: 0 0 20px; display: none; }
.ogiri-result-label { font-size: 15px; font-weight: 900; color: #f5d76e; letter-spacing: 4px; margin-bottom: 6px; }
.ogiri-result-num { font-size: 58px; font-weight: 900; color: #ffdd44; text-shadow: 0 0 30px rgba(255,221,68,0.8); animation: textGlow 0.8s ease infinite alternate; }
.ogiri-result-unit { font-size: 22px; margin-left: 4px; }
.ogiri-entry { text-align: center; font-size: 13px; color: #d4af37; padding: 0 0 10px; display: none; }
.ogiri-ippon { text-align: center; padding: 0 0 20px; display: none; }
.ogiri-ippon-text { font-size: 64px; font-weight: 900; color: #ffdd44; letter-spacing: 10px; text-shadow: 0 0 30px rgba(255,221,68,0.9); animation: textGlow 0.5s ease infinite alternate; }
.ogiri-ippon-sub { font-size: 15px; color: #f5d76e; margin-top: 6px; font-weight: 900; }
.ogiri-failed { text-align: center; padding: 0 0 20px; display: none; }
.ogiri-failed-text { font-size: 38px; font-weight: 900; color: #88aaff; letter-spacing: 5px; }
.ogiri-failed-sub { font-size: 13px; color: #8899aa; margin-top: 8px; }

/* ── ランキング ── */
.ranking-panel {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  width: 220px;
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(0,200,255,0.3);
  border-radius: 14px;
  padding: 12px;
  z-index: 50;
}
.ranking-title {
  color: #00c8ff;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(0,200,255,0.2);
  padding-bottom: 8px;
}
.ranking-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 4px;
  border-radius: 7px;
  margin-bottom: 3px;
}
.ranking-item:nth-child(2) { background: rgba(255,215,0,0.12); }
.ranking-item:nth-child(3) { background: rgba(192,192,192,0.10); }
.ranking-item:nth-child(4) { background: rgba(205,127,50,0.10); }
.ranking-rank {
  font-size: 13px;
  font-weight: 900;
  color: #888;
  width: 22px;
  text-align: center;
}
.ranking-rank.gold   { color: #ffd700; }
.ranking-rank.silver { color: #c0c0c0; }
.ranking-rank.bronze { color: #cd7f32; }
.ranking-name {
  flex: 1;
  font-size: 11px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ranking-score {
  font-size: 10px;
  color: #00c8ff;
  text-align: right;
  line-height: 1.4;
}

  </style>
</head>
<body>
<div id="app"></div>
<script>
// ============================================================
// ★ サーバー接続先設定
//    localhost・LAN内IPで開いたときは開いた場所にそのまま接続し、
//    それ以外（Live Studio・GitHub Pages経由）はngrok固定ドメインを使う
// ============================================================
const NGROK_HTTPS = 'https://annually-outlast-remarry.ngrok-free.dev';
const NGROK_WSS   = 'wss://annually-outlast-remarry.ngrok-free.dev';
const IS_LOCAL = /^(localhost|127\.0\.0\.1|192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+)$/.test(location.hostname);
const SERVER_HTTPS = IS_LOCAL ? location.origin : NGROK_HTTPS;
const SERVER_WSS   = IS_LOCAL ? location.origin.replace(/^http/, 'ws') : NGROK_WSS;

// HTML注入対策: 視聴者名・コメントなど外部由来の文字列は必ずこれを通して表示する
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// 相対パス（/naigif.jpg など）をngrok経由の絶対URLに変換
function absUrl(u) {
  if (!u) return u;
  if (u.startsWith('http://') || u.startsWith('https://')) return u;
  if (u.startsWith('/')) return SERVER_HTTPS + u;
  return u;
}

// ============================================================
// 位置設定（画面の%で指定。ここを変えると表示位置が変わります）
// ============================================================
let effectConfig = {};
async function loadEffectConfig() {
  try {
    const res = await fetch(SERVER_HTTPS + '/api/config', {
      headers: { 'ngrok-skip-browser-warning': 'true' }
    });
    const data = await res.json();
    effectConfig = data.effects || {};
  } catch(e) { console.log('config取得失敗、デフォルト使用'); }
}
function getPos(key) {
  return effectConfig[key]?.position || { x:55, y:45 };
}

// ============================================================
// 運勢スタイル
// ============================================================
const RARITIES = {
  '超吉':{ bg:'linear-gradient(135deg,#ff0080,#ff6600,#ffff00)', glow:'#ff00aa', emoji:'👑', superRare:true },
  '大吉':{ bg:'linear-gradient(135deg,#ffd700,#ff8c00)',          glow:'#ffd700', emoji:'✨' },
  '中吉':{ bg:'linear-gradient(135deg,#ff6b6b,#ee5a24)',          glow:'#ff6b6b', emoji:'🌸' },
  '吉':  { bg:'linear-gradient(135deg,#20bf6b,#01a3a4)',          glow:'#20bf6b', emoji:'🍀' },
  '凶':  { bg:'linear-gradient(135deg,#636e72,#2d3436)',          glow:'#636e72', emoji:'🌧️' },
  '大凶':{ bg:'linear-gradient(135deg,#c0392b,#6c0101)',          glow:'#c0392b', emoji:'💀' },
};

// ============================================================
// エフェクト管理
// ============================================================
const app = document.getElementById('app');
let currentWrap = null;
let cdInterval   = null;
let dismissTimer = null;
let quizData     = null;

function clearEffect(cb) {
  if (cdInterval)   { clearInterval(cdInterval);   cdInterval   = null; }
  if (dismissTimer) { clearTimeout(dismissTimer);  dismissTimer = null; }
  if (currentWrap) {
    currentWrap.classList.add('out');
    const old = currentWrap;
    setTimeout(() => { old.remove(); if (cb) cb(); }, 700);
    currentWrap = null;
  } else {
    if (cb) cb();
  }
}

function createWrap(key) {
  clearEffect();
  const w = document.createElement('div');
  w.className = 'effect-wrap';
  const p = getPos(key);
  w.style.left = p.x + '%';
  w.style.top  = p.y + '%';
  app.appendChild(w);
  currentWrap = w;
  return w;
}

function startCountdown(sec, el, onDone) {
  let cd = sec;
  if (el) el.textContent = cd + '秒後に閉じます';
  cdInterval = setInterval(() => {
    cd--;
    if (el && cd > 0) el.textContent = cd + '秒後に閉じます';
    if (cd <= 0) {
      clearInterval(cdInterval); cdInterval = null;
      clearEffect(onDone);
    }
  }, 1000);
}

// ============================================================
// 占いエフェクト
// ============================================================
function showFortune(data) {
  const w = createWrap('fortune');
  const r = RARITIES[data.luck] || RARITIES['吉'];
  const isChoki = !!r.superRare;

  const borderStyle = isChoki
    ? `border:3px solid transparent;
       background-image:linear-gradient(#0a0014,#0a0014),linear-gradient(135deg,#ff0080,#ff6600,#ffff00,#00ff00,#0080ff,#ff0080);
       background-origin:border-box; background-clip:padding-box,border-box;`
    : `border:2px solid ${r.glow};`;

  w.innerHTML = `
    <div style="position:relative; width:280px;">
      ${isChoki ? '<div class="super-rare-banner">⚡ SUPER RARE ⚡</div>' : ''}
      <div class="fortune-card" style="${borderStyle} box-shadow:0 0 60px ${r.glow}88;">
        <div class="fortune-header" style="background:${r.bg};">
          <div class="fortune-header-shine"></div>
          <span class="fortune-emoji" style="${isChoki?'animation:iconPulse 0.6s ease infinite alternate;':''}">${r.emoji}</span>
          <div class="fortune-luck" style="font-size:${isChoki?'36px':'30px'}; text-shadow:0 0 30px ${r.glow};">${data.luck}</div>
        </div>
        <div class="fortune-body">
          <div class="fortune-row">
            <span class="fortune-row-icon">💕</span>
            <span class="fortune-row-label">恋愛運</span>
            <span class="fortune-row-value">${data.love}</span>
          </div>
          <div class="fortune-row">
            <span class="fortune-row-icon">💼</span>
            <span class="fortune-row-label">仕事運</span>
            <span class="fortune-row-value">${data.work}</span>
          </div>
          <div class="fortune-row" style="background:${r.glow}22; border:1px solid ${r.glow}44;">
            <span class="fortune-row-icon">🎨</span>
            <span class="fortune-row-label">ラッキーカラー</span>
            <span class="fortune-row-value" style="color:${r.glow};">${data.lucky_color}</span>
          </div>
          <div class="fortune-msg" style="background:linear-gradient(135deg,${r.glow}22,transparent); border:1px solid ${r.glow}33;">✨ ${data.message}</div>
        </div>
      </div>
      <div class="countdown" id="f-cd"></div>
    </div>`;

  startCountdown(10, document.getElementById('f-cd'));
}

// ============================================================
// クイズエフェクト
// ============================================================
function showQuiz(data) {
  quizData = data;
  const w = createWrap('quiz');

  const choicesHTML = data.choices
    ? `<div class="quiz-choices">
        <div class="quiz-choice choice-a"><div class="quiz-choice-icon">🅰️</div>${data.choices[0]}</div>
        <div class="quiz-choice choice-b"><div class="quiz-choice-icon">🅱️</div>${data.choices[1]}</div>
       </div>`
    : `<div class="quiz-free">💬 チャットに答えを書いてね！</div>`;

  w.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-card">
        <div class="quiz-header">
          <span class="quiz-header-icon">🎯</span>
          <span class="quiz-header-text">クイズです！</span>
        </div>
        <div class="quiz-body">
          <div class="quiz-question">${data.question}</div>
          ${choicesHTML}
          <div class="quiz-hint">ヒント：${data.hint || ''}</div>
          <div class="timer-wrap"><div class="timer-bar" id="q-bar" style="width:100%;background:linear-gradient(90deg,#44ff88,#44ff8888);"></div></div>
          <div class="timer-num" id="q-num" style="color:#44ff88;">5</div>
        </div>
        <div class="quiz-footer"></div>
      </div>
      <div class="chat-stream" id="chat-stream"></div>
    </div>`;

  let t = 5;
  cdInterval = setInterval(() => {
    t--;
    const pct = (t / 5) * 100;
    const col = t <= 1 ? '#ff2244' : t <= 2 ? '#ff8800' : t <= 3 ? '#ffcc00' : '#44ff88';
    const bar = document.getElementById('q-bar');
    const num = document.getElementById('q-num');
    if (bar) { bar.style.width = pct + '%'; bar.style.background = `linear-gradient(90deg,${col},${col}88)`; }
    if (num) { num.textContent = t; num.style.color = col; }
    if (t <= 0) {
      clearInterval(cdInterval); cdInterval = null;
      showAnswer(w, data);
    }
  }, 1000);
}

function showAnswer(w, data) {
  w.innerHTML = `
    <div>
      <div class="answer-card">
        <div class="answer-label">🎉 正解は…</div>
        <div class="answer-text">${data.answer}</div>
        <div class="answer-expl">${data.explanation || ''}</div>
        <div class="answer-challenge">またクイズに挑戦してね！🌟</div>
      </div>
      <div class="countdown" id="a-cd"></div>
    </div>`;
  startCountdown(3, document.getElementById('a-cd'));
}

function addChat(user, text, correct) {
  const el = document.getElementById('chat-stream');
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'chat-msg' + (correct ? ' correct' : '');
  d.innerHTML = `<span class="chat-name${correct?' correct':''}">${esc(user)}</span>${esc(text)}`;
  el.appendChild(d);
  while (el.children.length > 6) el.removeChild(el.firstChild);
}

// ============================================================
// ナイギフエフェクト
// ============================================================
function showNaigif() {
  const w = createWrap('keikoku');

function ogiriShowSection(section) {

}

// 残り時間はサーバーが送るendsAt（終了予定時刻）とDate.now()の差から算出する。
// こうすると再接続やタブ復帰のあとでも残り時間がずれない
function startOgiriCountdown(endsAt, updateFn) {
  if (!endsAt) return;
  const tick = () => {
    const remain = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
    updateFn(remain);
    if (remain <= 0 && ogiriCdInterval) { clearInterval(ogiriCdInterval); ogiriCdInterval = null; }
  };
  tick();
  ogiriCdInterval = setInterval(tick, 250);
}

// 音声の再生。ngrok経由だとAudio要素の直接読み込みは警告ページに阻まれるため、
// fetch（警告スキップ用ヘッダ付き）で取得してから再生する
async function playOgiriAudio(url, label) {
  if (!url) return;
  try {
    const res = await fetch(absUrl(url), { headers: { 'ngrok-skip-browser-warning': 'true' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    // お題の読み上げは毎回違うファイルなので、再生し終えたらメモリを解放する
    const objectUrl = URL.createObjectURL(blob);
    const audio = new Audio(objectUrl);
    const release = () => URL.revokeObjectURL(objectUrl);
    audio.onended = release;
    audio.onerror = release;
    audio.play().catch(e => { release(); console.log(label + 'の再生失敗（自動再生の許可を確認）:', e); });
  } catch (e) {
    console.log(label + 'の取得失敗:', e.message);
  }
}

// isSnapshot=true は再接続直後の状態復元。画面は復元するが、音声は再生しない（二重再生防止）
function handleOgiriState(data, isSnapshot) {
  const el = ensureOgiriEl();
  if (data.matrix) ogiriMatrix = data.matrix;
  const telopOn = ogiriRowOn('telop'); // テロップOFFならボード自体を出さない（音声・採点は独立に判定）
  if (ogiriCdInterval) { clearInterval(ogiriCdInterval); ogiriCdInterval = null; }
  if (data.odai !== undefined) ogiriUpdateImage(data.odai);
  ogiriUpdateEntry(data.entry);

  if (data.state === 'INTRO' && data.odai) {
    // お題テロップ表示＋読み上げ音声＋お題専用音源の再生
    document.getElementById('ogiri-text').textContent = data.odai.text;
    ogiriShowSection(null);
    el.style.display = telopOn ? 'block' : 'none';
    if (!isSnapshot && data.startSoundUrl && ogiriRowOn('telopSound')) {
      playOgiriAudio(data.startSoundUrl, 'お題開始効果音');
    }
    if (!isSnapshot && data.voiceUrl && ogiriRowOn('voice')) {
      playOgiriAudio(data.voiceUrl, 'お題読み上げ');
    }
    if (!isSnapshot && data.odaiSoundUrl && ogiriRowOn('sound')) {
      playOgiriAudio(data.odaiSoundUrl, 'お題専用音源');
    }
  } else if (data.state === 'ANSWERING') {
    // 回答時間のカウントダウン表示（endsAt基準なので再接続後も正しい残り時間になる）
    if (data.odai) document.getElementById('ogiri-text').textContent = data.odai.text;
    el.style.display = telopOn ? 'block' : 'none';
    ogiriShowSection('timer');
    const numEl = document.getElementById('ogiri-timer-num');
    startOgiriCountdown(data.endsAt, (remain) => {
      numEl.textContent = remain;
      numEl.style.color = remain <= 5 ? '#ff4444' : '#f5d76e';
    });
  } else if (data.state === 'SCORING') {
    // 採点タイム：残り時間と現在の合計点
    if (data.odai) document.getElementById('ogiri-text').textContent = data.odai.text;
    el.style.display = telopOn ? 'block' : 'none';
    ogiriShowSection('scoring');
    document.getElementById('ogiri-score-num').textContent = (data.score != null ? data.score : data.total) || 0;
    const cdEl = document.getElementById('ogiri-scoring-cd');
    startOgiriCountdown(data.endsAt, (remain) => {
      cdEl.textContent = 'あと' + remain + '秒';
    });
  } else if (data.state === 'IPPON') {
    // IPPON！基準点到達
    el.style.display = telopOn ? 'block' : 'none';
    ogiriShowSection('ippon');
    document.getElementById('ogiri-ippon-sub').textContent = (data.total != null ? data.total : data.score || 0) + '点獲得！';
    if (!isSnapshot && data.ipponSoundUrl && ogiriRowOn('ipponSound')) {
      playOgiriAudio(data.ipponSoundUrl, 'IPPON効果音');
    }
  } else if (data.state === 'FAILED_RESULT') {
    // 基準点に届かず時間切れ
    el.style.display = telopOn ? 'block' : 'none';
    ogiriShowSection('failed');
    document.getElementById('ogiri-failed-sub').textContent = (data.total != null ? data.total : data.score || 0) + '点どまり… また挑戦してね！';
    if (!isSnapshot && data.failedSoundUrl && ogiriRowOn('failedSound')) {
      playOgiriAudio(data.failedSoundUrl, '失敗効果音');
    }
  } else if (data.state === 'RESULT') {
    // 結果発表：合計点＋効果音（旧方式との互換用に残置）
    el.style.display = telopOn ? 'block' : 'none';
    ogiriShowSection('result');
    document.getElementById('ogiri-result-num').textContent = data.total || 0;
    if (!isSnapshot && data.resultSoundUrl && ogiriRowOn('resultSound')) {
      playOgiriAudio(data.resultSoundUrl, '結果発表効果音');
    }
  } else {
    // COOLDOWN / IDLE：テロップを消す
    el.style.display = 'none';
  }
}

// パターンD：シンプル演出（フォロー・ギフト・キーワード・いいね・コメント欄）
// ============================================================
const PD_LIKE_MAX = 5; // いいね音の同時再生数の上限（連打で鳴りすぎないように）
let pdLikePlaying = 0;

// この画面（配信オーバーレイ）宛ての演出かどうか
function pdForMe(data) {
  return !data.targets || data.targets.overlay !== false;
}

function pdEnsureLayer() {
  let el = document.getElementById('pd-layer');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pd-layer';
    el.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:120;';
    app.appendChild(el);
  }
  return el;
}

// 音声・動画はngrok経由だと直接読み込めないため、fetchで取得してから再生する。
// 同じファイルは使い回してメモリの無駄遣いを防ぐ（長時間配信でいいね音が積み上がるのを防止）
// 取得中のものも記録しておき、同じ素材を同時に要求されても1回しか取得しないようにする
const pdMediaCache = new Map(); // url → 取得処理（Promise）
async function pdFetchMediaUrl(url) {
  if (pdMediaCache.has(url)) return pdMediaCache.get(url);

  const task = (async () => {
    const res = await fetch(absUrl(url), { headers: { 'ngrok-skip-browser-warning': 'true' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return URL.createObjectURL(await res.blob());
  })();

  // 種類が増えすぎたら古いものを解放する
  if (pdMediaCache.size >= 30) {
    const oldestKey = pdMediaCache.keys().next().value;
    const oldTask = pdMediaCache.get(oldestKey);
    pdMediaCache.delete(oldestKey);
    Promise.resolve(oldTask).then(u => URL.revokeObjectURL(u)).catch(() => {});
  }
  pdMediaCache.set(url, task);
  // 取得に失敗したら記録を消して、次回やり直せるようにする
  task.catch(() => pdMediaCache.delete(url));
  return task;
}

function pdShowEffect(data) {
  if (!pdForMe(data)) return;
  const layer = pdEnsureLayer();
  const p = data.position || { x: 50, y: 40 };
  const box = document.createElement('div');
  box.style.cssText = `position:absolute;left:${p.x}%;top:${p.y}%;transform:translate(-50%,-50%);text-align:center;`;
  layer.appendChild(box);

  // 画像（枠・ベースなし）
  if (data.imageUrl) {
    const img = document.createElement('img');
    img.src = absUrl(data.imageUrl);
    img.style.cssText = 'display:block;margin:0 auto;max-width:45vw;max-height:45vh;';
    box.appendChild(img);
  }
  // 名前入りテロップ（フォローありがとう等）
  if (data.message) {
    const label = document.createElement('div');
    label.textContent = String(data.message).replace('{name}', data.viewer || '');
    label.style.cssText = 'margin-top:8px;font-size:32px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(0,0,0,0.9),0 2px 6px rgba(0,0,0,0.9);white-space:nowrap;';
    box.appendChild(label);
  }
  // 動画（枠なし。再生し終わったら自動で消える）
  if (data.videoUrl) {
    pdFetchMediaUrl(data.videoUrl).then(src => {
      const v = document.createElement('video');
      v.src = src;
      v.autoplay = true;
      v.style.cssText = 'display:block;margin:8px auto 0;max-width:45vw;max-height:45vh;';
      v.onended = () => v.remove();
      box.appendChild(v);
      v.play().catch(e => console.log('動画の再生失敗（自動再生の許可を確認）:', e));
    }).catch(e => console.log('動画の取得失敗:', e.message));
  }
  // 音源
  if (data.soundUrl) {
    pdFetchMediaUrl(data.soundUrl)
      .then(src => new Audio(src).play().catch(e => console.log('音源の再生失敗:', e)))
      .catch(e => console.log('音源の取得失敗:', e.message));
  }

  // 指定時間で画像・テロップを消す（動画は再生終了時に自分で消える）
  setTimeout(() => box.remove(), (data.seconds || 5) * 1000);
}

// いいね音：順番待ちせず、押されたタイミングでそのまま再生（重ねてOK）
function pdPlayLike(data) {
  if (!pdForMe(data) || !data.soundUrl) return;
  if (pdLikePlaying >= PD_LIKE_MAX) return;
  pdLikePlaying++;
  pdFetchMediaUrl(data.soundUrl).then(src => {
    const a = new Audio(src);
    a.onended = a.onerror = () => { pdLikePlaying = Math.max(0, pdLikePlaying - 1); };
    a.play().catch(e => { pdLikePlaying = Math.max(0, pdLikePlaying - 1); console.log('いいね音の再生失敗:', e); });
  }).catch(e => { pdLikePlaying = Math.max(0, pdLikePlaying - 1); console.log('いいね音の取得失敗:', e.message); });
}

// コメント欄表示
function pdUpdateFeed(data) {
  const cfg = data.feed;
  let feed = document.getElementById('pd-feed');
  if (!cfg || cfg.enabled === false || cfg.overlay === false) { if (feed) feed.remove(); return; }
  if (!feed) {
    feed = document.createElement('div');
    feed.id = 'pd-feed';
    feed.style.cssText = 'position:fixed;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:110;width:30vw;';
    app.appendChild(feed);
  }
  // 位置は「コメント欄の左上」を指す。画面外へはみ出さないよう0〜95%に収める
  const p = cfg.position || { x: 12, y: 75 };
  feed.style.left = Math.min(95, Math.max(0, p.x)) + '%';
  feed.style.top = Math.min(95, Math.max(0, p.y)) + '%';
  feed.style.transform = 'none';

  const item = document.createElement('div');
  const base = cfg.baseEnabled !== false;
  const opacity = (cfg.baseOpacity != null) ? cfg.baseOpacity : 0.6;
  item.style.cssText = `color:${cfg.textColor || '#fff'};font-size:18px;font-weight:700;padding:${base ? '6px 12px' : '0'};`
    + `border-radius:${base ? '10px' : '0'};`
    + (base ? `background:${pdHexToRgba(cfg.baseColor || '#000000', opacity)};` : 'text-shadow:0 0 8px rgba(0,0,0,0.9),0 2px 4px rgba(0,0,0,0.9);');
  // 外部由来の文字列なので必ずエスケープして表示する
  item.innerHTML = `<span style="opacity:0.75;margin-right:6px;">${esc(data.nickname || data.user)}</span>${esc(data.text)}`;
  feed.appendChild(item);
  const max = Math.min(15, Math.max(1, cfg.count || 5));
  while (feed.children.length > max) feed.removeChild(feed.firstChild);
}

function pdHexToRgba(hex, alpha) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex));
  if (!m) return `rgba(0,0,0,${alpha})`;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function updateRankingPanel(data, cfg) {
  let panel = document.getElementById('ranking-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'ranking-panel';
    panel.className = 'ranking-panel';
    document.getElementById('app').appendChild(panel);
  }
  // 位置設定（管理画面のX/Y%指定）。未設定なら従来どおり右端中央
  if (cfg && cfg.position) {
    panel.style.left = cfg.position.x + '%';
    panel.style.top = cfg.position.y + '%';
    panel.style.right = 'auto';
    panel.style.transform = 'translate(-50%,-50%)';
  }
  // 0件になったら（リセット時）パネルごと消す
  if (!data || data.length === 0) { panel.remove(); return; }
  const medals = ['gold', 'silver', 'bronze'];
  const rows = data.map((item, i) => `
    <div class="ranking-item">
      <div class="ranking-rank ${medals[i] || ''}">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
      <div class="ranking-name">${esc(item.nickname)}</div>
      <div class="ranking-score">💎${item.diamonds}<br>🎁${item.count}</div>
    </div>
  `).join('');
  panel.innerHTML = `<div class="ranking-title">🏆 ギフトランキング</div>${rows}`;
}

// ============================================================
// WebSocket接続（ngrok経由 wss）
// ============================================================
function connectWS() {
  let ws;
  try {
    ws = new WebSocket(SERVER_WSS);

    ws.onopen = () => console.log('WebSocket接続OK:', SERVER_WSS);

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);

      // チャット（クイズ回答用）
      if (data.type === 'chat') {
        if (quizData && document.getElementById('chat-stream')) {
          const correct = quizData.answer && data.text.includes(quizData.answer);
          addChat(data.user, data.text, correct);
        }
        pdUpdateFeed(data); // パターンDのコメント欄表示（feed設定が付いているときだけ描画）
        return;
      }

      // エフェクト
      switch (data.effect) {
        case 'fortune': showFortune(data.data);                                   break;
        case 'quiz':    showQuiz(data.data);                                       break;
        case 'naigif':  showNaigif();                                              break;
        case 'hora1':   showAudioEffect('🐟','びっくりした魚','#00ccff','hora1'); break;
        case 'hora2':   showAudioEffect('📣','名前の呼びかけ','#ff8844','hora2'); break;
        case 'oldies':  showAudioEffect('🎵','オールディーズ','#aa44ff','oldies');break;
        case 'keikoku': showKeikoku(data.text, data.rarity); break;
        case 'ranking':
          if (ogiriRowOn('ranking')) updateRankingPanel(data.data, data.cfg);
          else { const rp = document.getElementById('ranking-panel'); if (rp) rp.remove(); }
          break;
        case 'pd-effect': pdShowEffect(data); break;
        case 'pd-like':   pdPlayLike(data);   break;
        case 'ogiri-state': handleOgiriState(data, false); break;
        case 'ogiri-snapshot': handleOgiriState(data, true); break;
        case 'ogiri-score': handleOgiriScore(data); break;
        default:
          // 管理画面で追加した演出（extra_image_1 など）は決まった名前を持たないため、
          // サーバーから届いた設定をそのまま使って表示する
          if (data.effectConfig) showExtraEffect(data.effect, data.effectConfig);
          break;
      }
    };

    ws.onclose = () => {
      console.log('切断 → 3秒後に再接続');
      setTimeout(connectWS, 3000);
    };
  } catch(e) {
    setTimeout(connectWS, 3000);
  }
}

async function init() {
  await loadEffectConfig();
  connectWS();
}
init();
</script>
</body>
</html>
